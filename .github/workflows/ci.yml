name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: document
          POSTGRES_PASSWORD: document
          POSTGRES_DB: document
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U document" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.2-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/contract/requirements.txt

      - name: Install contract test dependencies
        run: python -m pip install -r tests/contract/requirements.txt

      - name: Check PDFium setup script
        run: bash tests/check_pdfium_setup_script.sh

      - name: Install PDFium
        run: bash scripts/setup_pdfium.sh

      - name: Install OpenCV
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPDFium_DIR=third_party/pdfium -DDOCUMENT_INTELLIGENCE_ENGINE_AUTO_SETUP_PADDLEOCR_BASELINE=ON -DDOCUMENT_INTELLIGENCE_ENGINE_AUTO_SETUP_TABLE_TRANSFORMER=ON -DDOCUMENT_INTELLIGENCE_ENGINE_REQUIRE_BENCHMARK_MODELS=ON -DDOCUMENT_INTELLIGENCE_ENGINE_BUILD_PLATFORM_WORKER=ON

      - name: Verify required benchmark models
        run: |
          test -s models/paddleocr/baseline/det.onnx
          test -s models/paddleocr/baseline/rec.onnx
          test -s models/paddleocr/baseline/ppocrv5_dict.txt
          test -s models/layout/doclaynet/model.onnx
          test -s models/layout/paddle/pp-doclayout-v3.onnx
          test -s models/table/table-transformer/detection.onnx
          test -s models/table/table-transformer/structure.onnx

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Upload OCR benchmark report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: paddle-ocr-benchmark
          path: build/tests/paddle_ocr_report.json
          if-no-files-found: warn

      - name: Show help
        run: ./build/cpp/app/document_intelligence_engine --help

      - name: Check optional platform worker
        run: test -x ./build/platform/worker/document_intelligence_worker

      - name: Verify job delivery, recovery and cancellation
        env:
          DIE_TEST_DATABASE_URL: postgresql://document:document@localhost:5432/document
          DIE_TEST_REDIS_URL: redis://localhost:6379/0
          DIE_TEST_WORKER: ${{ github.workspace }}/build/platform/worker/document_intelligence_worker
          PYTHONPATH: platform/api
        run: |
          python -m pip install './platform/api[test]'
          python -m pytest platform/api/tests/test_delivery_integration.py platform/api/tests/test_worker_recovery_integration.py platform/api/tests/test_cancellation_integration.py

      - name: Check argument validation
        run: |
          set +e
          ./build/cpp/app/document_intelligence_engine missing.pdf --out output
          status=$?
          set -e
          test "$status" -ne 0

  vcpkg:
    name: Build with vcpkg packages
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure package-manager build
        shell: bash
        run: |
          vcpkg_root="${VCPKG_INSTALLATION_ROOT:-$(dirname "$(readlink -f "$(command -v vcpkg)")")}"
          test -f "${vcpkg_root}/scripts/buildsystems/vcpkg.cmake"
          cmake -S . -B build/vcpkg-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${vcpkg_root}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON \
            -DVCPKG_MANIFEST_FEATURES=tests \
            -DDOCUMENT_INTELLIGENCE_ENGINE_ENABLE_PDFIUM=OFF \
            -DDOCUMENT_INTELLIGENCE_ENGINE_ENABLE_OPENCV=OFF \
            -DDOCUMENT_INTELLIGENCE_ENGINE_ENABLE_ONNXRUNTIME=OFF

      - name: Build package-manager consumers
        run: |
          cmake --build build/vcpkg-ci \
            --target document_intelligence_engine domain_unit_tests \
            --parallel
