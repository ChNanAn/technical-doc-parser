name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/portable-cli.Dockerfile'
      - 'scripts/check_linux_cli_compatibility.sh'
      - 'scripts/package_release.sh'
      - 'tests/check_portable_cli_builder.sh'
      - 'vcpkg.json'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish or recover
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release definition
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release metadata and scripts
        run: |
          python3 scripts/package_model_pack.py validate
          bash -n scripts/package_release.sh
          bash -n scripts/check_linux_cli_compatibility.sh
          bash -n scripts/setup_paddleocr_baseline.sh
          bash -n scripts/setup_doclaynet_layout.sh
          bash -n scripts/setup_paddle_layout.sh
          bash -n scripts/setup_table_transformer.sh
          bash tests/check_portable_cli_builder.sh "$PWD"

  portable-smoke:
    name: Build portable Linux CLI candidate
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set portable build metadata
        run: |
          echo "RELEASE_REVISION=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          echo "RELEASE_SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" \
            >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build portable Linux CLI bundle
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/portable-cli.Dockerfile
          target: artifacts
          outputs: type=local,dest=build/portable-artifacts
          build-args: |
            REVISION=${{ env.RELEASE_REVISION }}
            SOURCE_DATE_EPOCH=${{ env.RELEASE_SOURCE_DATE_EPOCH }}
          cache-from: type=gha,scope=portable-linux-cli
          cache-to: type=gha,mode=max,scope=portable-linux-cli

      - name: Verify portable Linux CLI bundle
        shell: bash
        run: |
          shopt -s nullglob
          (
            cd build/portable-artifacts
            sha256sum --check SHA256SUMS
          )
          cli_archive=(
            build/portable-artifacts/technical-doc-parser-*-linux-x86_64-cli.tar.gz
          )
          test "${#cli_archive[@]}" -eq 1
          mkdir -p build/portable-extracted
          tar -xzf "${cli_archive[0]}" -C build/portable-extracted
          cli_root=(
            build/portable-extracted/technical-doc-parser-*-linux-x86_64-cli
          )
          test "${#cli_root[@]}" -eq 1
          bash scripts/check_linux_cli_compatibility.sh "${cli_root[0]}"

      - name: Upload portable CLI candidate
        uses: actions/upload-artifact@v6
        with:
          name: portable-linux-cli-${{ github.sha }}
          path: |
            build/portable-artifacts/*.tar.gz
            build/portable-artifacts/SHA256SUMS
          if-no-files-found: error

  release:
    name: Source, Linux CLI, and container
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Validate tag version
        shell: bash
        run: |
          project_version="$(awk '$1 == "VERSION" {print $2; exit}' CMakeLists.txt)"
          test "${RELEASE_TAG}" = "v${project_version}"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "${tag_commit}"
          echo "RELEASE_REVISION=${tag_commit}" >> "${GITHUB_ENV}"
          echo "RELEASE_SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" \
            >> "${GITHUB_ENV}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/contract/requirements.txt

      - name: Install contract test dependencies
        run: python -m pip install -r tests/contract/requirements.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev

      - name: Download and verify baseline model pack
        run: |
          bash scripts/setup_paddleocr_baseline.sh
          bash scripts/setup_doclaynet_layout.sh
          bash scripts/setup_paddle_layout.sh
          bash scripts/setup_table_transformer.sh
          python3 scripts/package_model_pack.py verify

      - name: Configure program build
        run: |
          cmake -S . -B build/release \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DDOCUMENT_INTELLIGENCE_ENGINE_AUTO_SETUP_PADDLEOCR_BASELINE=OFF \
            -DDOCUMENT_INTELLIGENCE_ENGINE_AUTO_SETUP_DOCLAYNET_LAYOUT=OFF \
            -DDOCUMENT_INTELLIGENCE_ENGINE_AUTO_SETUP_PADDLE_LAYOUT=OFF \
            -DDOCUMENT_INTELLIGENCE_ENGINE_AUTO_SETUP_TABLE_TRANSFORMER=OFF

      - name: Build release targets
        run: cmake --build build/release --parallel

      - name: Test release build
        run: |
          ctest --test-dir build/release \
            --label-exclude benchmark \
            --output-on-failure \
            --no-tests=error

      - name: Package source
        run: |
          bash scripts/package_release.sh \
            --kind source \
            --output-dir dist
          cd dist
          sha256sum --check SHA256SUMS

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build portable Linux CLI bundle
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/portable-cli.Dockerfile
          target: artifacts
          outputs: type=local,dest=build/portable-artifacts
          build-args: |
            REVISION=${{ env.RELEASE_REVISION }}
            SOURCE_DATE_EPOCH=${{ env.RELEASE_SOURCE_DATE_EPOCH }}
          cache-from: type=gha,scope=portable-linux-cli
          cache-to: type=gha,mode=max,scope=portable-linux-cli

      - name: Verify portable Linux CLI bundle
        shell: bash
        run: |
          shopt -s nullglob
          (
            cd build/portable-artifacts
            sha256sum --check SHA256SUMS
          )
          cli_archive=(
            build/portable-artifacts/technical-doc-parser-*-linux-x86_64-cli.tar.gz
          )
          test "${#cli_archive[@]}" -eq 1
          mkdir -p build/portable-extracted
          tar -xzf "${cli_archive[0]}" -C build/portable-extracted
          cli_root=(
            build/portable-extracted/technical-doc-parser-*-linux-x86_64-cli
          )
          test "${#cli_root[@]}" -eq 1
          bash scripts/check_linux_cli_compatibility.sh "${cli_root[0]}"
          mv "${cli_archive[0]}" dist/

      - name: Package models separately
        run: |
          python3 scripts/package_model_pack.py package \
            --source-date-epoch "${RELEASE_SOURCE_DATE_EPOCH}" \
            --output-dir dist
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish CLI container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/cli.Dockerfile
          push: true
          tags: |
            ghcr.io/chnanan/technical-doc-parser:${{ env.RELEASE_TAG }}
            ghcr.io/chnanan/technical-doc-parser:latest
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
            REVISION=${{ env.RELEASE_REVISION }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
